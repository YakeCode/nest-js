services:
  # BD para desarrollo
  postgres:
    image: postgres:18
    container_name: nest-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: nest-test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "4000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d shopify-bsale-db -h localhost -p 5432",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
